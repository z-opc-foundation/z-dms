# =====================================================================================
# z-dms 形态 A 宿主样例的配置（z-dms-demo-host）
#
# ⚠️ 凭据纪律：本文件里**没有任何明文口令**。
#   * 元数据库口令：z.base.db.dms.password ← 环境变量 ZDMS_META_DB_PASSWORD（无默认值 ⇒ 缺了就启动失败，不静默兜底）
#   * 被管数据源的凭据：不在本文件里，只留 credentialRef 指向的键名；
#     键名对应的内容由环境变量 ZDMS_DEMO_CREDENTIAL 注入（JSON：{"username":"...","password":"..."}）
#   形状沿用 z-boot 的 `z.base.db.{module}.*` 约定（module = dms），缺省回退 `z.base.db.default.*`
# =====================================================================================

server:
  port: ${ZDMS_DEMO_PORT:18099}

spring:
  application:
    name: zdms-demo-host

z:
  base:
    db:
      # 元数据库（数据源定义的存储）：键名 z.base.db.dms.*
      dms:
        host: ${ZDMS_META_DB_HOST:127.0.0.1}
        port: ${ZDMS_META_DB_PORT:33307}
        database: ${ZDMS_META_DB_NAME:oc}
        username: ${ZDMS_META_DB_USERNAME:root}
        password: ${ZDMS_META_DB_PASSWORD}
  dms:
    enabled: true
    # 登记落库（表结构见 _doc/004_sql/）
    store-enabled: true
    # 定时探活间隔
    probe-interval-ms: 30000
    # 单池探活超时
    probe-timeout-ms: 3000
    # z-dms 自己的健康端点（宿主另有一个 /health 并上它）
    health-path: /dms/health
    # 凭据解析走 Environment（自检用；生产口径走 z-mist：z.dms.mist.enabled=true）
    credential:
      dms-demo:
        mysql-main: ${ZDMS_DEMO_CREDENTIAL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
